name: Checkov Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scan_target:
        description: Select the Terraform test set
        required: true
        default: hardened
        type: choice
        options:
          - hardened
          - vulnerable

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov ${{ matrix.test_case }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_case: TC01 Public SSH
            vulnerable_file: terraform/vulnerable/01-open-ssh.tf
            hardened_file: terraform/hardened/01-restricted-ssh.tf
            check_id: CKV_AWS_24

          - test_case: TC02 S3 Public Access
            vulnerable_file: terraform/vulnerable/02-public-s3.tf
            hardened_file: terraform/hardened/02-private-s3.tf
            check_id: CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56

          - test_case: TC03 S3 KMS Encryption
            vulnerable_file: terraform/vulnerable/03-sse-s3.tf
            hardened_file: terraform/hardened/03-kms-s3.tf
            check_id: CKV_AWS_145

          - test_case: TC04 EBS Encryption
            vulnerable_file: terraform/vulnerable/04-unencrypted-ebs.tf
            hardened_file: terraform/hardened/04-encrypted-ebs.tf
            check_id: CKV_AWS_3

          - test_case: TC05 IMDSv2
            vulnerable_file: terraform/vulnerable/05-imdsv1-enabled.tf
            hardened_file: terraform/hardened/05-imdsv2-required.tf
            check_id: CKV_AWS_79

          - test_case: TC06 IAM Least Privilege
            vulnerable_file: terraform/vulnerable/06-wildcard-iam.tf
            hardened_file: terraform/hardened/06-least-privilege-iam.tf
            check_id: CKV_AWS_63

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Terraform test file
        id: target
        shell: bash
        env:
          SCAN_TARGET: ${{ github.event.inputs.scan_target || 'hardened' }}
          VULNERABLE_FILE: ${{ matrix.vulnerable_file }}
          HARDENED_FILE: ${{ matrix.hardened_file }}
        run: |
          if [ "$SCAN_TARGET" = "vulnerable" ]; then
            SELECTED_FILE="$VULNERABLE_FILE"
          else
            SELECTED_FILE="$HARDENED_FILE"
          fi

          echo "file=$SELECTED_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected target: $SCAN_TARGET"
          echo "Selected file: $SELECTED_FILE"

      - name: Run targeted Checkov security scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          file: ${{ steps.target.outputs.file }}
          framework: terraform
          check: ${{ matrix.check_id }}
          quiet: false
          compact: true
          soft_fail: false